<html lang="pt-BR"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<style>
:root {
  --marvel-dark: #002855;
  --marvel-blue: #004b9c;
  --marvel-accent: #facc15;
  --bg-light: #f4f6f9;
  --text-main: #374151;
  --border-color: #d1d5db;
}
body { margin:0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:var(--bg-light); color:var(--text-main); }
.main { padding: 40px; display: flex; justify-content: center;}
.grid { display: grid; grid-template-columns: 550px 400px; gap: 30px; align-items: start; max-width: 1000px; width: 100%;}

/* Cards */
.card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); border: 1px solid #e5e7eb;}
.resultado-box { background: var(--marvel-dark); color: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,40,85,0.2); min-height: 400px; box-sizing: border-box;}

/* Typography */
h3 { color: var(--marvel-dark); margin-top: 0; margin-bottom: 20px; font-size: 20px; border-bottom: 2px solid var(--bg-light); padding-bottom: 12px;}
h4 { color: var(--marvel-dark); margin-top: 25px; margin-bottom: 12px; font-size: 15px; font-weight: bold;}
.resultado-box h3 { color: white; border-bottom-color: rgba(255,255,255,0.1); }

/* Inputs */
input { width:100%; padding:12px; margin-bottom:15px; border:1px solid var(--border-color); border-radius:6px; font-size:14px; box-sizing: border-box; transition: all 0.2s; background: #f9fafb;}
input:focus { outline: none; border-color: var(--marvel-blue); box-shadow: 0 0 0 3px rgba(0, 75, 156, 0.1); background: white;}
.row { display:flex; gap:15px; }

/* Buttons */
.btn-primary { width: 100%; padding: 14px; background: var(--marvel-blue); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; margin-top: 15px; transition: background 0.2s;}
.btn-primary:hover { background: #003a7a; }
.btn-success { background:#22c55e; color:white; border:none; padding:10px 15px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:bold; transition: background 0.2s; }
.btn-success:hover { background:#16a34a; }

/* Toggles and Tags */
.modo-toggle {display:flex; gap:10px; margin-bottom:25px;}
.modo-btn {flex:1; padding:12px; border:1px solid var(--border-color); background:white; color:var(--text-main); border-radius:6px; cursor:pointer; font-weight:bold; transition: all 0.2s; font-size: 13px;}
.modo-btn:hover {background: var(--bg-light);}
.modo-btn.ativo {background:var(--marvel-blue); color:white; border-color:var(--marvel-blue);}
.tag { background:var(--marvel-blue); color:white; padding:6px 12px; border-radius:20px; font-size:12px; cursor:pointer; font-weight: 600;}

/* Autocomplete/Dropdowns */
/* A lista deve ficar acima dos campos seguintes, sem bordas atravessando as opções. */
div:has(> input + .suggestions){position:relative;isolation:isolate;}
div:has(> input + .suggestions):has(> .suggestions:not(:empty)){z-index:1000;}
div:has(> input + .suggestions):focus-within{z-index:1001;}
.suggestions {background:#ffffff!important;opacity:1!important;border:1px solid var(--border-color);border-radius:6px;position:absolute;top:calc(100% - 15px);left:0;right:0;z-index:1001;width:100%;max-height:220px;overflow-y:auto;overflow-x:hidden;box-shadow:0 8px 20px rgba(0,0,0,.16);box-sizing:border-box;}
.suggestions:empty{display:none;}
.suggestions div{background:#fff;position:relative;z-index:1;padding:11px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #edf0f4;line-height:1.45;}
.suggestions div:last-child{border-bottom:0;}
.suggestions div:hover{background:#edf5ff;color:var(--marvel-blue);}
.suggestions div {padding:10px 12px; cursor:pointer; font-size: 13px;}
.suggestions div:hover {background:var(--bg-light); color: var(--marvel-blue);}
.dropdown {position:relative; border:1px solid var(--border-color); border-radius:6px; padding:8px; background:#f9fafb; cursor:pointer; margin-bottom:15px; min-height: 20px;}
.dropdown-box {display:flex; flex-wrap:wrap; gap:6px;}
.dropdown-list {display:none; position:absolute; top:100%; left:0; right:0; background:white; border:1px solid var(--border-color); border-radius: 6px; max-height:180px; overflow:auto; z-index:20; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 4px;}
.dropdown.open .dropdown-list {display:block;}
.dropdown-item {padding:10px 12px; font-size: 14px;}
.dropdown-item:hover {background:var(--bg-light); color: var(--marvel-blue);}
.pais-item {border-bottom:1px solid rgba(255,255,255,0.1); padding:15px 0; font-size: 14px; line-height: 1.6;}
</style>

<script>
/* =========================================================
   CACHE DE KM - Supabase + localStorage
   1) Rode o SQL enviado no Supabase.
   2) Preencha SUPABASE_URL e SUPABASE_ANON_KEY abaixo.
   3) Se deixar vazio, o sistema usa somente cache local do navegador.
========================================================= */
var SUPABASE_URL = "https://ndpfmjetlvcujhgphqoi.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kcGZtamV0bHZjdWpoZ3BocW9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NDk2MTksImV4cCI6MjA5ODAyNTYxOX0.M1ypP2OOSGOojCGWfq-X1UNJzfYhD8a-J47QtR6Qw00";

function normalizarCoord(coord){
  return [Number(coord[0]).toFixed(6), Number(coord[1]).toFixed(6)];
}

function chaveRota(a,b){
  const A = normalizarCoord(a).join(",");
  const B = normalizarCoord(b).join(",");
  return `${A}|${B}`;
}

async function buscarKmSupabase(chave){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return null;
  try{
    const url = `${SUPABASE_URL}/rest/v1/cache_rotas_km?route_key=eq.${encodeURIComponent(chave)}&select=km&limit=1`;
    const r = await fetch(url, {
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    if(!r.ok) return null;
    const dados = await r.json();
    if(dados && dados.length && Number(dados[0].km) > 0) return Number(dados[0].km);
  }catch(e){ console.warn("Falha ao buscar km no Supabase", e); }
  return null;
}

async function salvarKmSupabase(chave,a,b,km,origemTela){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
  try{
    const A = normalizarCoord(a);
    const B = normalizarCoord(b);
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/cache_rotas_km?on_conflict=route_key`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "resolution=merge-duplicates,return=minimal"
      },
      body: JSON.stringify({
        route_key: chave,
        origem_lng: Number(A[0]),
        origem_lat: Number(A[1]),
        destino_lng: Number(B[0]),
        destino_lat: Number(B[1]),
        km: Number(km),
        origem_tela: origemTela || null,
        atualizado_em: new Date().toISOString()
      })
    });
    if(!resp.ok){
      const erro = await resp.text();
      console.warn("Supabase não salvou a rota:", erro);
    }
  }catch(e){ console.warn("Falha ao salvar km no Supabase", e); }
}

async function getKmComCache(a,b,origemTela){
  const chave = chaveRota(a,b);
  const localKey = `km_cache_${chave}`;
  window.__fontesKm = window.__fontesKm || {};

  // 1) Supabase é a fonte prioritária
  const cacheSupabase = await buscarKmSupabase(chave);
  if(cacheSupabase){
    localStorage.setItem(localKey, String(cacheSupabase));
    window.__fontesKm[chave] = "Supabase";
    console.info(`[KM] ${Number(cacheSupabase).toFixed(2)} km | Fonte: Supabase | ${chave}`);
    return Number(cacheSupabase);
  }

  // 2) Cache local como segunda opção
  const cacheLocal = localStorage.getItem(localKey);
  if(cacheLocal && Number(cacheLocal) > 0){
    window.__fontesKm[chave] = "Cache local";
    console.info(`[KM] ${Number(cacheLocal).toFixed(2)} km | Fonte: Cache local | ${chave}`);
    // sincroniza um valor real já conhecido com o Supabase
    salvarKmSupabase(chave,a,b,Number(cacheLocal),origemTela);
    return Number(cacheLocal);
  }

  // 3) Rota real via função serverless da Vercel.
  // A chamada parte do nosso próprio domínio, evitando bloqueios CORS do Valhalla/OSRM no navegador.
  let km = null;
  let estimado = false;
  try {
    if(location.protocol === "file:") throw new Error("API de rota requer o painel publicado na Vercel");
    const controllerRota = new AbortController();
    const timerRota = setTimeout(() => controllerRota.abort(), 20000);
    let r;
    try {
      r = await fetch(`/api/rota?aLng=${encodeURIComponent(a[0])}&aLat=${encodeURIComponent(a[1])}&bLng=${encodeURIComponent(b[0])}&bLat=${encodeURIComponent(b[1])}`, { signal: controllerRota.signal });
    } finally {
      clearTimeout(timerRota);
    }
    if(!r.ok){
      let detalhe = "";
      try { detalhe = (await r.json())?.error || ""; } catch(_){}
      throw new Error(`API rota HTTP ${r.status}${detalhe ? ` - ${detalhe}` : ""}`);
    }
    const resultadoRota = await r.json();
    if(!Number.isFinite(Number(resultadoRota.km)) || Number(resultadoRota.km) <= 0) throw new Error("API rota sem distância válida");
    km = Number(resultadoRota.km);
    window.__fontesKm[chave] = resultadoRota.fonte || "API de rota";
    console.info(`[KM] ${Number(km).toFixed(2)} km | Fonte: ${window.__fontesKm[chave]} | ${chave}`);
  } catch(e) {
    const toRad = v => v * Math.PI / 180;
    const lat1 = toRad(a[1]), lat2 = toRad(b[1]);
    const dLat = toRad(b[1]-a[1]), dLon = toRad(b[0]-a[0]);
    const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
    const linhaReta = 6371 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
    km = linhaReta * 1.22;
    estimado = true;
    window.__kmEstimadoDados = true;
    window.__fontesKm[chave] = "Estimativa";
    console.warn(`[KM] ${Number(km).toFixed(2)} km | Fonte: Estimativa | ${chave}`, e);
  }

  // Somente distâncias obtidas de roteador são persistidas. Estimativas nunca contaminam o cache/Supabase.
  if(!estimado){
    localStorage.setItem(localKey, String(km));
    salvarKmSupabase(chave,a,b,km,origemTela);
  }
  return km;
}
</script>

let cidades={origem:null,aduana:null,destino:null};

// Cache compartilhado entre Origem, Aduana e Destino, sem alterar as coordenadas usadas no cálculo.
const cacheCidades=new Map();
const CHAVE_CIDADES='marvel_cidades_autocomplete_mercosul_v2';
const PAISES_CIDADES=new Set(['BR','CL','AR','PY','UY','PE']);
const paisCidadePermitido=c=>PAISES_CIDADES.has(String(c?.countryCode||'').toUpperCase());
try{
  const salvas=JSON.parse(localStorage.getItem(CHAVE_CIDADES)||'[]');
  if(Array.isArray(salvas))salvas.forEach(c=>{
    if(paisCidadePermitido(c)&&typeof c.label==='string'&&Array.isArray(c.coordinates)&&c.coordinates.length===2&&c.coordinates.every(Number.isFinite))
      cacheCidades.set(c.label.toLocaleLowerCase('pt-BR'),[c]);
  });
}catch(e){console.warn('Cache de cidades não disponível',e);}
function cidadesLocais(texto){
  const termo=normalizarBuscaCidade(texto).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const resultado=[],vistos=new Set();
  for(const lista of cacheCidades.values())for(const c of lista){
    if(!paisCidadePermitido(c))continue;
    const nome=c.label.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(nome.includes(termo)&&!vistos.has(nome)){vistos.add(nome);resultado.push(c);}
  }
  return resultado.slice(0,7);
}
function guardarCidades(lista){
  for(const c of lista){
    if(paisCidadePermitido(c)&&c?.label&&Array.isArray(c.coordinates)&&c.coordinates.length===2&&c.coordinates.every(Number.isFinite))
      cacheCidades.set(normalizarBuscaCidade(c.label),[c]);
  }
  try{
    const unicas=new Map();
    for(const grupo of cacheCidades.values())for(const c of grupo)if(c?.label&&Array.isArray(c.coordinates))unicas.set(normalizarBuscaCidade(c.label),c);
    localStorage.setItem(CHAVE_CIDADES,JSON.stringify([...unicas.values()].slice(-350)));
  }catch(e){console.warn('Não foi possível salvar cidades',e);}
}

const normalizarBuscaCidade=t=>String(t||'').trim().toLocaleLowerCase('pt-BR');
async function consultarCidadesRapido(texto,signal,ignorarCache=false){
  const locais=cidadesLocais(texto);
  if(locais.length&&!ignorarCache)return locais;
  // Cada provedor tem seu próprio prazo e é cancelado ao trocar a pesquisa.
  const buscar=async(url,converter,timeoutMs)=>{
    const controller=new AbortController();
    const cancelar=()=>controller.abort();
    signal.addEventListener('abort',cancelar,{once:true});
    const timer=setTimeout(()=>controller.abort(),timeoutMs);
    try{
      const r=await fetch(url,{signal:controller.signal});
      if(!r.ok)throw new Error('HTTP '+r.status);
      return converter(await r.json()).filter(c=>paisCidadePermitido(c)&&c?.label&&Array.isArray(c.coordinates)&&c.coordinates.length===2&&c.coordinates.every(Number.isFinite));
    }finally{
      clearTimeout(timer);
      signal.removeEventListener('abort',cancelar);
    }
  };
  const photon=()=>buscar('https://photon.komoot.io/api/?q='+encodeURIComponent(texto)+'&limit=20',d=>(d.features||[]).map(c=>{
    const p=c.properties||{};
    const partes=[p.name,p.city,p.state,p.country].filter((v,i,a)=>v&&a.indexOf(v)===i);
    return {label:partes.join(', ')||texto,coordinates:c.geometry.coordinates,countryCode:p.countrycode||p.countryCode};
  }),2500);
  const nominatim=()=>buscar('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=20&countrycodes=br,cl,ar,py,uy,pe&q='+encodeURIComponent(texto),d=>d.map(c=>({
    label:c.display_name,coordinates:[Number(c.lon),Number(c.lat)],countryCode:c.address?.country_code
  })),3500);
  const openMeteo=()=>buscar('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(texto)+'&count=20&language=pt&format=json',d=>(d.results||[]).map(c=>({
    label:[c.name,c.admin1,c.country].filter((v,i,a)=>v&&a.indexOf(v)===i).join(', '),
    coordinates:[Number(c.longitude),Number(c.latitude)],countryCode:c.country_code
  })),3500);
  let ultimoErro=null;
  const encontrados=[];
  for(const provider of [photon,openMeteo,nominatim]){
    if(signal.aborted)throw new DOMException('Busca cancelada','AbortError');
    try{
      const resultados=await provider();
      if(resultados.length){
        encontrados.push(...resultados);
        if(!ignorarCache){guardarCidades(resultados);return resultados.slice(0,20);}
      }
    }catch(e){if(signal.aborted)throw e;ultimoErro=e;console.warn('Provedor de cidades indisponível:',e);}
  }
  if(encontrados.length){guardarCidades(encontrados);return encontrados;}
  if(ultimoErro)console.warn('Todos os provedores de cidades falharam:',ultimoErro);
  return [];
}
function auto(id,sug,key){

  const exibir=(items,autoSelecionar,textoOriginal)=>{
    box.replaceChildren();
    if(!items.length){box.textContent='Nenhuma cidade encontrada.';return;}
    const normalizar=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
    const termo=normalizar(textoOriginal);
    const validos=items.filter(c=>paisCidadePermitido(c));
    // Prioriza correspondência exata do nome da cidade, antes de bairros e pontos de interesse.
    const ordenados=validos.map((c,idx)=>{
      const nome=normalizar(c.label.split(',')[0]);
      return {c,idx,score:nome===termo?0:nome.startsWith(termo)?1:2};
    }).sort((a,b)=>a.score-b.score||a.idx-b.idx);
    if(autoSelecionar){
      const esperadoBruto=i.dataset.cidadeEsperada||textoOriginal;
      const separada=String(esperadoBruto).match(/^(.+?)\s*\/\s*([A-Z]{2})$/i);
      const esperado=separada?separada[1].trim():esperadoBruto;
      const uf=(i.dataset.ufEsperada||separada?.[2]||'').toUpperCase();
      const norm=normalizar;
      const estados={SC:'santa catarina',RS:'rio grande do sul',PR:'parana',SP:'sao paulo',RJ:'rio de janeiro',MG:'minas gerais',RO:'rondonia',MT:'mato grosso',MS:'mato grosso do sul',BA:'bahia',GO:'goias',ES:'espirito santo',PA:'para',PB:'paraiba',PE:'pernambuco',CE:'ceara',AM:'amazonas',AC:'acre',AP:'amapa',RR:'roraima',TO:'tocantins',MA:'maranhao',PI:'piaui',RN:'rio grande do norte',AL:'alagoas',SE:'sergipe',DF:'distrito federal'};
      const match=ordenados.find(({c})=>{
        const partes=c.label.split(',').map(v=>norm(v));
        const cidade=norm(esperado).split(',')[0].trim();
        if(partes[0]!==cidade)return false;
        if(!uf)return true;
        if(uf.toUpperCase()==='EX'){
          const paisesConhecidos={'puerto montt':'chile','mar del plata':'argentina','montevideo':'uruguai','buenos aires':'argentina','santiago':'chile','asuncion':'paraguai','quemchi':'chile'};
          const pais=paisesConhecidos[cidade];
          return pais?partes.some(p=>p===pais):!['br','brazil','brasil'].includes(norm(c.countryCode||partes[partes.length-1]));
        }
        const estado=norm(estados[uf.toUpperCase()]||uf);
        if(partes.slice(1).some(p=>p===estado||p===norm(uf)))return true;
        // Alguns geocodificadores devolvem apenas "São Paulo, Brasil" para a
        // capital paulista, sem o estado. Aceitar somente este caso inequívoco.
        if(cidade==='sao paulo'&&uf.toUpperCase()==='SP'&&
           partes.length===2&&['brasil','brazil'].includes(partes[1])&&
           (!c.countryCode||['br','bra'].includes(norm(c.countryCode))))return true;
        return false;
      });
      if(match){selecionar(match.c);delete i.dataset.cidadeEsperada;delete i.dataset.ufEsperada;return;}
      // Não selecionar outra cidade/UF apenas porque o geocoder a sugeriu primeiro.
      i.value=esperado+(uf?' / '+uf:'');

      box.textContent='Localidade exata não encontrada. Selecione manualmente uma opção correta.';

    const vistos=new Set();
    ordenados.forEach(({c})=>{
      const chave=normalizar(c.label);
      if(vistos.has(chave))return;
      vistos.add(chave);
      const div=document.createElement('div');
      div.textContent=c.label;
      div.onclick=()=>{selecionar(c);++seq;controller?.abort();};
      box.appendChild(div);
    });
  };
  i.addEventListener('input',(event)=>{
    // Digitação real: mostrar opções. Preenchimento automatizado da PC: selecionar a primeira cidade.
    const preenchimentoAutomatico=event.isTrusted===false;
    cidades[key]=null;
    clearTimeout(timer);

    if(texto.length<3){box.replaceChildren();return;}
    timer=setTimeout(async()=>{
      const cidadeUf=preenchimentoAutomatico?texto.match(/^(.+?)\s*\/\s*([A-Z]{2})$/i):null;
      const cidadeBusca=cidadeUf?cidadeUf[1].trim():texto;
      if(cidadeUf&&!i.dataset.ufEsperada)i.dataset.ufEsperada=cidadeUf[2].toUpperCase();
      const locais=cidadesLocais(cidadeBusca);

      const nomeNormalizado=cidadeBusca.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().trim();
      const buscaGeografica=preenchimentoAutomatico&&i.dataset.ufEsperada==='EX'&&paisPorCidade[nomeNormalizado]?cidadeBusca+', '+paisPorCidade[nomeNormalizado]:cidadeBusca;

      const ufEsperada=i.dataset.ufEsperada;
      const nomeEsperado=cidadeBusca.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

      if(locais.length&&cacheConfiavel){if(minhaSeq===seq)exibir(locais,preenchimentoAutomatico,texto);return;}
      box.textContent='Buscando cidades...';
      controller=new AbortController();
      try{
        const items=await consultarCidadesRapido(buscaGeografica,controller.signal,preenchimentoAutomatico&&!cacheConfiavel);
        if(minhaSeq!==seq)return;
        exibir(items,preenchimentoAutomatico,texto);
      }catch(e){
        if(minhaSeq!==seq)return;
        console.warn('Autocomplete indisponível:',e);
        box.textContent='Busca indisponível no momento. Tente novamente.';
      }
    },350);
  });
  i.addEventListener('keydown',e=>{
    if(e.key==='Escape')box.replaceChildren();
  });
}

else if(modo==="seguro"){ freteBase=freteUSD; freteTotal=freteUSD+seguro; }

let intManual=parseFloat(document.getElementById("freteInternoManual").value);

else if(!isNaN(extManual) && !isNaN(intManual)){ externo=extManual; interno=intManual; }

    </div>
  `;
}

function copiarComFallback(texto, html, onSuccess){
  const sucesso = () => { if(typeof onSuccess === "function") onSuccess(); };

  // Funciona também quando o painel é aberto por file:// ou dentro de srcdoc.
  try{
    if(html){
      const area = document.createElement("div");
      area.contentEditable = "true";
      area.style.position = "fixed";
      area.style.left = "-99999px";
      area.style.top = "0";
      area.innerHTML = html;
      document.body.appendChild(area);

      const range = document.createRange();
      range.selectNodeContents(area);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      const ok = document.execCommand("copy");
      sel.removeAllRanges();
      area.remove();
      if(ok){ sucesso(); return true; }
    }
  }catch(e){ console.warn("Fallback HTML de cópia indisponível:", e); }

  try{
    const ta = document.createElement("textarea");
    ta.value = texto || "";
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-99999px";
    ta.style.top = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand("copy");
    ta.remove();
    if(ok){ sucesso(); return true; }
  }catch(e){ console.warn("Fallback texto de cópia indisponível:", e); }

  return false;
}

function copiarResultadoFormatado(){
  const html = montarResultadoHtmlParaCopiar();
  const texto = montarResultadoTextoParaCopiar();

  if(!html || !texto){ alert("Calcule primeiro antes de copiar."); return; }

  if(navigator.clipboard && window.ClipboardItem){
    const item = new ClipboardItem({
      "text/html": new Blob([html], {type:"text/html"}),
      "text/plain": new Blob([texto], {type:"text/plain"})
    });

    navigator.clipboard.write([item]).then(()=>{
      const btn = document.querySelector(".btn-success");
      btn.innerHTML = "✅ Copiado!";
      setTimeout(()=>{ btn.innerHTML = "📋 Copiar"; }, 2000);
    }).catch(()=>{
      const confirmar = () => {
        const btn = document.querySelector(".btn-success");
        if(btn){ btn.innerHTML = "✅ Copiado!"; setTimeout(()=>{ btn.innerHTML = "📋 Copiar"; }, 2000); }
      };
      if(!copiarComFallback(texto, html, confirmar)) copiarTextoSimples(texto);
    });
  }else{
    const confirmar = () => {
      const btn = document.querySelector(".btn-success");
      if(btn){ btn.innerHTML = "✅ Copiado!"; setTimeout(()=>{ btn.innerHTML = "📋 Copiar"; }, 2000); }
    };
    if(!copiarComFallback(texto, html, confirmar)) copiarTextoSimples(texto);
  }
}

function copiarTextoSimples(texto){
  const confirmar = () => {
    const btn = document.querySelector(".btn-success");
    if(btn){
      btn.innerHTML = "✅ Copiado!";
      setTimeout(()=>{ btn.innerHTML = "📋 Copiar"; }, 2000);
    }else{
      alert("Copiado.");
    }
  };

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(confirmar).catch(()=>{
      if(!copiarComFallback(texto, null, confirmar)) alert("Não foi possível copiar.");
    });
  }else if(!copiarComFallback(texto, null, confirmar)){
    alert("Não foi possível copiar.");
  }
}

<script>
/* =========================================================
   CACHE DE KM - Supabase + localStorage
   1) Rode o SQL enviado no Supabase.
   2) Preencha SUPABASE_URL e SUPABASE_ANON_KEY abaixo.
   3) Se deixar vazio, o sistema usa somente cache local do navegador.
========================================================= */
var SUPABASE_URL = "https://ndpfmjetlvcujhgphqoi.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kcGZtamV0bHZjdWpoZ3BocW9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NDk2MTksImV4cCI6MjA5ODAyNTYxOX0.M1ypP2OOSGOojCGWfq-X1UNJzfYhD8a-J47QtR6Qw00";

function normalizarCoord(coord){
  return [Number(coord[0]).toFixed(6), Number(coord[1]).toFixed(6)];
}

function chaveRota(a,b){
  const A = normalizarCoord(a).join(",");
  const B = normalizarCoord(b).join(",");
  return `${A}|${B}`;
}

async function buscarKmSupabase(chave){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return null;
  try{
    const url = `${SUPABASE_URL}/rest/v1/cache_rotas_km?route_key=eq.${encodeURIComponent(chave)}&select=km&limit=1`;
    const r = await fetch(url, {
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    if(!r.ok) return null;
    const dados = await r.json();
    if(dados && dados.length && Number(dados[0].km) > 0) return Number(dados[0].km);
  }catch(e){ console.warn("Falha ao buscar km no Supabase", e); }
  return null;
}

async function salvarKmSupabase(chave,a,b,km,origemTela){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
  try{
    const A = normalizarCoord(a);
    const B = normalizarCoord(b);
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/cache_rotas_km?on_conflict=route_key`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "resolution=merge-duplicates,return=minimal"
      },
      body: JSON.stringify({
        route_key: chave,
        origem_lng: Number(A[0]),
        origem_lat: Number(A[1]),
        destino_lng: Number(B[0]),
        destino_lat: Number(B[1]),
        km: Number(km),
        origem_tela: origemTela || null,
        atualizado_em: new Date().toISOString()
      })
    });
    if(!resp.ok){
      const erro = await resp.text();
      console.warn("Supabase não salvou a rota:", erro);
    }
  }catch(e){ console.warn("Falha ao salvar km no Supabase", e); }
}

async function getKmComCache(a,b,origemTela){
  const chave = chaveRota(a,b);
  const localKey = `km_cache_${chave}`;
  window.__fontesKm = window.__fontesKm || {};

  // 1) Supabase é a fonte prioritária
  const cacheSupabase = await buscarKmSupabase(chave);
  if(cacheSupabase){
    localStorage.setItem(localKey, String(cacheSupabase));
    window.__fontesKm[chave] = "Supabase";
    console.info(`[KM] ${Number(cacheSupabase).toFixed(2)} km | Fonte: Supabase | ${chave}`);
    return Number(cacheSupabase);
  }

  // 2) Cache local como segunda opção
  const cacheLocal = localStorage.getItem(localKey);
  if(cacheLocal && Number(cacheLocal) > 0){
    window.__fontesKm[chave] = "Cache local";
    console.info(`[KM] ${Number(cacheLocal).toFixed(2)} km | Fonte: Cache local | ${chave}`);
    // sincroniza um valor real já conhecido com o Supabase
    salvarKmSupabase(chave,a,b,Number(cacheLocal),origemTela);
    return Number(cacheLocal);
  }

  // 3) Rota real via função serverless da Vercel.
  // A chamada parte do nosso próprio domínio, evitando bloqueios CORS do Valhalla/OSRM no navegador.
  let km = null;
  let estimado = false;
  try {
    if(location.protocol === "file:") throw new Error("API de rota requer o painel publicado na Vercel");
    const controllerRota = new AbortController();
    const timerRota = setTimeout(() => controllerRota.abort(), 20000);
    let r;
    try {
      r = await fetch(`/api/rota?aLng=${encodeURIComponent(a[0])}&aLat=${encodeURIComponent(a[1])}&bLng=${encodeURIComponent(b[0])}&bLat=${encodeURIComponent(b[1])}`, { signal: controllerRota.signal });
    } finally {
      clearTimeout(timerRota);
    }
    if(!r.ok){
      let detalhe = "";
      try { detalhe = (await r.json())?.error || ""; } catch(_){}
      throw new Error(`API rota HTTP ${r.status}${detalhe ? ` - ${detalhe}` : ""}`);
    }
    const resultadoRota = await r.json();
    if(!Number.isFinite(Number(resultadoRota.km)) || Number(resultadoRota.km) <= 0) throw new Error("API rota sem distância válida");
    km = Number(resultadoRota.km);
    window.__fontesKm[chave] = resultadoRota.fonte || "API de rota";
    console.info(`[KM] ${Number(km).toFixed(2)} km | Fonte: ${window.__fontesKm[chave]} | ${chave}`);
  } catch(e) {
    const toRad = v => v * Math.PI / 180;
    const lat1 = toRad(a[1]), lat2 = toRad(b[1]);
    const dLat = toRad(b[1]-a[1]), dLon = toRad(b[0]-a[0]);
    const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
    const linhaReta = 6371 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
    km = linhaReta * 1.22;
    estimado = true;
    window.__kmEstimadoDados = true;
    window.__fontesKm[chave] = "Estimativa";
    console.warn(`[KM] ${Number(km).toFixed(2)} km | Fonte: Estimativa | ${chave}`, e);
  }

  // Somente distâncias obtidas de roteador são persistidas. Estimativas nunca contaminam o cache/Supabase.
  if(!estimado){
    localStorage.setItem(localKey, String(km));
    salvarKmSupabase(chave,a,b,km,origemTela);
  }
  return km;
}

const normalizarBuscaCidade=t=>String(t||'').trim().toLocaleLowerCase('pt-BR');
async function consultarCidadesRapido(texto,signal,ignorarCache=false){
  const locais=cidadesLocais(texto);
  if(locais.length&&!ignorarCache)return locais;
  // Cada provedor tem seu próprio prazo e é cancelado ao trocar a pesquisa.
  const buscar=async(url,converter,timeoutMs)=>{
    const controller=new AbortController();
    const cancelar=()=>controller.abort();
    signal.addEventListener('abort',cancelar,{once:true});
    const timer=setTimeout(()=>controller.abort(),timeoutMs);
    try{
      const r=await fetch(url,{signal:controller.signal});
      if(!r.ok)throw new Error('HTTP '+r.status);
      return converter(await r.json()).filter(c=>paisCidadePermitido(c)&&c?.label&&Array.isArray(c.coordinates)&&c.coordinates.length===2&&c.coordinates.every(Number.isFinite));
    }finally{
      clearTimeout(timer);
      signal.removeEventListener('abort',cancelar);
    }
  };
  const photon=()=>buscar('https://photon.komoot.io/api/?q='+encodeURIComponent(texto)+'&limit=20',d=>(d.features||[]).map(c=>{
    const p=c.properties||{};
    const partes=[p.name,p.city,p.state,p.country].filter((v,i,a)=>v&&a.indexOf(v)===i);
    return {label:partes.join(', ')||texto,coordinates:c.geometry.coordinates,countryCode:p.countrycode||p.countryCode};
  }),2500);
  const nominatim=()=>buscar('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=20&countrycodes=br,cl,ar,py,uy,pe&q='+encodeURIComponent(texto),d=>d.map(c=>({
    label:c.display_name,coordinates:[Number(c.lon),Number(c.lat)],countryCode:c.address?.country_code
  })),3500);
  const openMeteo=()=>buscar('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(texto)+'&count=20&language=pt&format=json',d=>(d.results||[]).map(c=>({
    label:[c.name,c.admin1,c.country].filter((v,i,a)=>v&&a.indexOf(v)===i).join(', '),
    coordinates:[Number(c.longitude),Number(c.latitude)],countryCode:c.country_code
  })),3500);
  let ultimoErro=null;
  const encontrados=[];
  for(const provider of [photon,openMeteo,nominatim]){
    if(signal.aborted)throw new DOMException('Busca cancelada','AbortError');
    try{
      const resultados=await provider();
      if(resultados.length){
        encontrados.push(...resultados);
        if(!ignorarCache){guardarCidades(resultados);return resultados.slice(0,20);}
      }
    }catch(e){if(signal.aborted)throw e;ultimoErro=e;console.warn('Provedor de cidades indisponível:',e);}
  }
  if(encontrados.length){guardarCidades(encontrados);return encontrados;}
  if(ultimoErro)console.warn('Todos os provedores de cidades falharam:',ultimoErro);
  return [];
}
function auto(id,sug,key){
  const i=document.getElementById(id),box=document.getElementById(sug);
  if(!i||!box)return;
  let timer=null,seq=0,controller=null;
  const selecionar=(c,mostrarAlternativas=false)=>{
    if(!c||!paisCidadePermitido(c))return;
    i.value=c.label;
    cidades[key]=c.coordinates;
    if(!mostrarAlternativas)box.replaceChildren();
  };
  const exibir=(items,autoSelecionar,textoOriginal)=>{
    box.replaceChildren();
    if(!items.length){box.textContent='Nenhuma cidade encontrada.';return;}
    const normalizar=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
    const termo=normalizar(textoOriginal);
    const validos=items.filter(c=>paisCidadePermitido(c));
    // Prioriza correspondência exata do nome da cidade, antes de bairros e pontos de interesse.
    const ordenados=validos.map((c,idx)=>{
      const nome=normalizar(c.label.split(',')[0]);
      return {c,idx,score:nome===termo?0:nome.startsWith(termo)?1:2};
    }).sort((a,b)=>a.score-b.score||a.idx-b.idx);
    if(autoSelecionar){
      const esperadoBruto=i.dataset.cidadeEsperada||textoOriginal;
      const separada=String(esperadoBruto).match(/^(.+?)\s*\/\s*([A-Z]{2})$/i);
      const esperado=separada?separada[1].trim():esperadoBruto;
      const uf=(i.dataset.ufEsperada||separada?.[2]||'').toUpperCase();
      const norm=normalizar;
      const estados={SC:'santa catarina',RS:'rio grande do sul',PR:'parana',SP:'sao paulo',RJ:'rio de janeiro',MG:'minas gerais',RO:'rondonia',MT:'mato grosso',MS:'mato grosso do sul',BA:'bahia',GO:'goias',ES:'espirito santo',PA:'para',PB:'paraiba',PE:'pernambuco',CE:'ceara',AM:'amazonas',AC:'acre',AP:'amapa',RR:'roraima',TO:'tocantins',MA:'maranhao',PI:'piaui',RN:'rio grande do norte',AL:'alagoas',SE:'sergipe',DF:'distrito federal'};
      const match=ordenados.find(({c})=>{
        const partes=c.label.split(',').map(v=>norm(v));
        const cidade=norm(esperado).split(',')[0].trim();
        if(partes[0]!==cidade)return false;
        if(!uf)return true;
        if(uf.toUpperCase()==='EX'){
          const paisesConhecidos={'puerto montt':'chile','mar del plata':'argentina','montevideo':'uruguai','buenos aires':'argentina','santiago':'chile','asuncion':'paraguai','quemchi':'chile'};
          const pais=paisesConhecidos[cidade];
          return pais?partes.some(p=>p===pais):!['br','brazil','brasil'].includes(norm(c.countryCode||partes[partes.length-1]));
        }
        const estado=norm(estados[uf.toUpperCase()]||uf);
        if(partes.slice(1).some(p=>p===estado||p===norm(uf)))return true;
        // Alguns geocodificadores devolvem apenas "São Paulo, Brasil" para a
        // capital paulista, sem o estado. Aceitar somente este caso inequívoco.
        if(cidade==='sao paulo'&&uf.toUpperCase()==='SP'&&
           partes.length===2&&['brasil','brazil'].includes(partes[1])&&
           (!c.countryCode||['br','bra'].includes(norm(c.countryCode))))return true;
        return false;
      });
      if(match){selecionar(match.c);delete i.dataset.cidadeEsperada;delete i.dataset.ufEsperada;return;}
      // Não selecionar outra cidade/UF apenas porque o geocoder a sugeriu primeiro.
      i.value=esperado+(uf?' / '+uf:'');
      cidades[key]=null;
      box.textContent='Localidade exata não encontrada. Selecione manualmente uma opção correta.';
      return;
    }
    const vistos=new Set();
    ordenados.forEach(({c})=>{
      const chave=normalizar(c.label);
      if(vistos.has(chave))return;
      vistos.add(chave);
      const div=document.createElement('div');
      div.textContent=c.label;
      div.onclick=()=>{selecionar(c);++seq;controller?.abort();};
      box.appendChild(div);
    });
  };
  i.addEventListener('input',(event)=>{
    // Digitação real: mostrar opções. Preenchimento automatizado da PC: selecionar a primeira cidade.
    const preenchimentoAutomatico=event.isTrusted===false;
    cidades[key]=null;
    clearTimeout(timer);
    controller?.abort();
    const minhaSeq=++seq,texto=i.value.trim();
    if(!preenchimentoAutomatico){delete i.dataset.cidadeEsperada;delete i.dataset.ufEsperada;}
    if(texto.length<3){box.replaceChildren();return;}
    timer=setTimeout(async()=>{
      const cidadeUf=preenchimentoAutomatico?texto.match(/^(.+?)\s*\/\s*([A-Z]{2})$/i):null;
      const cidadeBusca=cidadeUf?cidadeUf[1].trim():texto;
      if(cidadeUf&&!i.dataset.ufEsperada)i.dataset.ufEsperada=cidadeUf[2].toUpperCase();
      const locais=cidadesLocais(cidadeBusca);
      // EX indica exterior no 902; o serviço geográfico precisa receber o país verdadeiro.
      const paisPorCidade={'puerto montt':'Chile','mar del plata':'Argentina','montevideo':'Uruguay','buenos aires':'Argentina','santiago':'Chile','asuncion':'Paraguay','quemchi':'Chile'};
      const nomeNormalizado=cidadeBusca.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().trim();
      const buscaGeografica=preenchimentoAutomatico&&i.dataset.ufEsperada==='EX'&&paisPorCidade[nomeNormalizado]?cidadeBusca+', '+paisPorCidade[nomeNormalizado]:cidadeBusca;
      // Cache pode conter cidade homônima de outra UF; nesse caso consultar o provedor.
      const ufEsperada=i.dataset.ufEsperada;
      const nomeEsperado=cidadeBusca.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
      const cacheConfiavel=!preenchimentoAutomatico||(!ufEsperada&&locais.some(c=>c.label.split(',')[0].normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()===nomeEsperado));
      if(locais.length&&cacheConfiavel){if(minhaSeq===seq)exibir(locais,preenchimentoAutomatico,texto);return;}
      box.textContent='Buscando cidades...';
      controller=new AbortController();
      try{
        const items=await consultarCidadesRapido(buscaGeografica,controller.signal,preenchimentoAutomatico&&!cacheConfiavel);
        if(minhaSeq!==seq)return;
        exibir(items,preenchimentoAutomatico,texto);
      }catch(e){
        if(minhaSeq!==seq)return;
        console.warn('Autocomplete indisponível:',e);
        box.textContent='Busca indisponível no momento. Tente novamente.';
      }
    },350);
  });
  i.addEventListener('keydown',e=>{
    if(e.key==='Escape')box.replaceChildren();
  });
}

let [km1, km2] = await Promise.all([

function copiarComFallbackRateio(texto, html, onSuccess){
  const sucesso = () => { if(typeof onSuccess === "function") onSuccess(); };

  // Fallback robusto para o iframe/srcdoc do Rateio.
  // Primeiro tenta copiar HTML (quando solicitado) e depois texto puro.
  try{
    if(html){
      const area = document.createElement("div");
      area.contentEditable = "true";
      area.style.position = "fixed";
      area.style.left = "-99999px";
      area.style.top = "0";
      area.innerHTML = html;
      document.body.appendChild(area);
      const range = document.createRange();
      range.selectNodeContents(area);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      const ok = document.execCommand("copy");
      sel.removeAllRanges();
      area.remove();
      if(ok){ sucesso(); return true; }
    }
  }catch(e){ console.warn("Fallback HTML do rateio indisponível:", e); }

  try{
    const ta = document.createElement("textarea");
    ta.value = texto || "";
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-99999px";
    ta.style.top = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand("copy");
    ta.remove();
    if(ok){ sucesso(); return true; }
  }catch(e){ console.warn("Fallback texto do rateio indisponível:", e); }

  return false;
}

async function copiarTextoRateio(texto, html, onSuccess){
  // Tenta a API moderna somente em contexto seguro; se falhar, usa execCommand.
  try{
    if(window.isSecureContext && navigator.clipboard){
      if(html && window.ClipboardItem && typeof navigator.clipboard.write === "function"){
        const item = new ClipboardItem({
          "text/html": new Blob([html], {type:"text/html"}),
          "text/plain": new Blob([texto], {type:"text/plain"})
        });
        await navigator.clipboard.write([item]);
        if(typeof onSuccess === "function") onSuccess();
        return true;
      }
      if(typeof navigator.clipboard.writeText === "function"){
        await navigator.clipboard.writeText(texto);
        if(typeof onSuccess === "function") onSuccess();
        return true;
      }
    }
  }catch(e){ console.warn("Clipboard API do rateio falhou; usando fallback:", e); }

  return copiarComFallbackRateio(texto, html, onSuccess);
}

function copiarFaturamento(){
  if(!window.ultimoRateioDetalhado || !Array.isArray(window.ultimoRateioDetalhado) || !window.ultimoRateioDetalhado.length){

    return;

  // Somente Pedido/Fatura + Frete em R$, em duas colunas para colagem direta.
  const texto = window.ultimoRateioDetalhado
    .map(item => `${item.numero}\tR$ ${item.convertido}`)
    .join("\n");

  const confirmar = () => {
    let btn = document.querySelector('.btn-copy-faturamento');
    if(btn){
      btn.innerHTML = "✅ Copiado!";
      setTimeout(() => { btn.innerHTML = "📋 Copiar p/ Faturamento"; }, 2000);
    }
  };

  copiarTextoRateio(texto, null, confirmar).then(ok => {

  });
}

function montarResultadoRateioHtmlParaCopiar(){
  const textoDetalhado = gerarTextoRateioDetalhado();
  if(!textoDetalhado) return null;

  const escapeHtml = (txt) => String(txt)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  const linhas = escapeHtml(textoDetalhado).split("\n");
  let htmlLinhas = linhas.map(linha => {
    if(!linha.trim()) return "<br>";
    const negrito = linha.replace(/^(Argentina|Chile|Uruguai|Peru|Paraguai) - Fatura (.*)$/,'<b>$1 - Fatura $2</b>')
      .replace(/^(Externo: \$ )(.*)$/,'$1<b>$2</b>')
      .replace(/^(Interno: \$ )(.*)$/,'$1<b>$2</b>')
      .replace(/^(Seguro: \$ )(.*)$/,'$1<b>$2</b>')
      .replace(/^(Frete Total \(USD\): \$ )(.*)$/,'$1<b>$2</b>');
    return negrito + "<br>";
  }).join("");

  return `<div style="font-family:Segoe UI,Arial,sans-serif;font-size:13px;line-height:1.25;color:#111;background:#fff;white-space:normal;">${htmlLinhas}</div>`;
}

function copiarResultadoRateioFormatado(){
  const html = montarResultadoRateioHtmlParaCopiar();

    }

    if(!ok) alert("Não foi possível copiar.");
  });
}
